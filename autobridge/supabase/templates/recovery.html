<!doctype html>
<html><body style="font-family:Arial,Helvetica,sans-serif;color:#1c1917;background:#fafaf9;padding:24px">
  <div style="max-width:520px;margin:auto;background:#fff;border:1px solid #e7e5e4;border-radius:12px;padding:24px">
    <h2 style="margin:0 0 16px">AutoBridge DZ</h2>
    <div dir="rtl" style="text-align:right">
      <p>تلقّينا طلبًا لإعادة تعيين كلمة مرور حسابك.</p>
      <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/{{ .Data.locale }}/auth/reset-password" style="background:#1e3a8a;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;display:inline-block">تعيين كلمة مرور جديدة</a></p>
    </div>
    <hr style="border:none;border-top:1px solid #e7e5e4;margin:20px 0">
    <div dir="ltr">
      <p>Nous avons reçu une demande de réinitialisation du mot de passe de votre compte.</p>
      <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/{{ .Data.locale }}/auth/reset-password" style="background:#1e3a8a;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none;display:inline-block">Choisir un nouveau mot de passe</a></p>
    </div>
    <p style="color:#78716c;font-size:12px">Ce lien expire dans une heure. / تنتهي صلاحية هذا الرابط خلال ساعة.</p>
  </div>
</body></html>
